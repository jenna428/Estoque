<div class="perfil d-inline">

    <div class="d-flex">
        <div class="container-fluid">
            <div class="d-flex justify-content-end">
                <div class="d-flex ms-3 mt-3">
                    <button type="button" *ngIf="isAdmin" class="btn btn-light ms-2 d-flex justify-content-center align-items-center" (click)="openCreateFornecedorDialog()">
                        <span class="material-symbols-outlined">
                            add_box
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="row d-flex justify-content-center mt-5">
        <table mat-table [dataSource]="dataSource" class="tabforn mat-elevation-z3">
            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef class="">
                    <span>Nome</span>
                </th>
                <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
            </ng-container>

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>
        
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
