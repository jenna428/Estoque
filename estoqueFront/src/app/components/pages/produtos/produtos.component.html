<!--Register button-->
<div class="d-flex">
    <div class="container-fluid">
        <div class="d-flex justify-content-end ms-3">
            <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" (click)="openCreateTipoItemDialog()">
                <span class="material-symbols-outlined">
                    add_ad
                </span>
            </button> 
        </div>
    </div>
</div>

<!--Products-->
<div class="d-flex justify-content-center">
    <div class="col-11">
        <div>
            <h1 id="produtos" class="text-center">Produtos</h1>
        </div>

        <!--Search-->
        <div class="row mb-3">
            <form [formGroup]="formSearch" (ngSubmit)="submit()" class="col-5" role="search" style="width: 250px;">
                <div class="d-flex border rounded">
                    <input matInput class="border-0 m-2 col" formControlName="search" type="search" placeholder="Busca" aria-label="Search">
                    <button class="border-0 col-1 bg-white rounded" type="submit">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                    </button>
                    
                </div>
            </form>

            <!--Filters-->
            <button type="button" class="btn btn-light ms-2 col-1" id="filterButton" (click)="toggleSidebar()" style="height: 40px; width: 40px;">
                <span class="material-symbols-outlined">tune</span>
            </button>

            <form [formGroup]="formOrder" (ngSubmit)="applyFilters()">
                <div class="sidebar col-1" [ngClass]="{'active': sidebarOpen}">
                    <h2>Ordenar por:</h2>
                    <ul class="pb-1">
                        <li><input type="radio" id="filter0" value="0" formControlName="order" > Sem filtro</li>
                        <li><input type="radio" id="filter1" value="1" formControlName="order" > menor preço</li>
                        <li><input type="radio" id="filter2" value="2" formControlName="order" > maior preço</li>
                    </ul>
                    <button type="submit" class="btn btn-light p-1">Aplicar</button>
                </div>
            </form>

            <!--Table-->
            <div class="row itens mt-3">
                <table mat-table [dataSource]="dataSource" class="mat-elevation-z3">

                    <ng-container matColumnDef="nome">
                        <th mat-header-cell *matHeaderCellDef>
                            <span>Nome</span>
                        </th>
                        <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
                    </ng-container>

                    <ng-container matColumnDef="departamento">
                        <th mat-header-cell *matHeaderCellDef> Departamento </th>
                        <td mat-cell *matCellDef="let element"> {{element.departamento.nome}} </td>
                    </ng-container>

                    <ng-container matColumnDef="fornecedor">
                        <th mat-header-cell *matHeaderCellDef> Fornecedor </th>
                        <td mat-cell *matCellDef="let element"> {{element.fornecedor.nome}} </td>
                    </ng-container>

                    <ng-container matColumnDef="preco">
                        <th mat-header-cell *matHeaderCellDef> Preço </th>
                        <td mat-cell *matCellDef="let element"> {{element.preco | currency:'BRL':'symbol':'1.2-2'}} </td>
                    </ng-container>

                    <!--quanntidade-->

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
                </table>
            </div>
        </div>
    </div>
    
</div>
