<div class="perfil d-inline">

    <div class="d-flex">
        <div class="container-fluid">
            <div class="d-flex justify-content-end">
                <div class="d-flex ms-3 mt-3">
                    <button *ngIf="isAdmin" type="button" class="btn btn-light ms-2 d-flex justify-content-center align-items-center" (click)="openCreateFuncionarioDialog()">
                        <span class="material-symbols-outlined">
                            person_add
                        </span>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="func d-flex mt-5 mb-5">

        <!--<img src="" alt="" class="img me-3 rounded-3">-->
        <div class="dados">
            <h1>Nome: </h1>
            <h2>ID: </h2>
        </div>

    </div>

    <div class="row funcionarios d-flex justify-content-center">
        <table mat-table [dataSource]="dataSource" class="tabfunc mat-elevation-z3">
            <ng-container matColumnDef="nome">
                <th mat-header-cell *matHeaderCellDef class="">
                    <span>Nome</span>
                </th>
                <td mat-cell *matCellDef="let element"> {{element.nome}} </td>
            </ng-container>

            <ng-container matColumnDef="id">
                <th mat-header-cell *matHeaderCellDef> ID </th>
                <td mat-cell *matCellDef="let element"> {{element.id}} </td>
            </ng-container>
        
            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
</div>
