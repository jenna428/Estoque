<!--Register button-->
<div class="d-flex">
    <div class="container-fluid">
        <div class="d-flex justify-content-end">
            <button type="button" class="btn btn-light ms-2 d-flex justify-content-center align-items-center m-2 p-2" (click)="openCreateItemDialog()">
                <span class="material-symbols-outlined">
                    add_ad
                </span>
            </button>
        </div>
    </div>
</div>

<!--Itens-->
<div class="d-flex justify-content-center">
    <div class="col-11">
        <div>
            <h1 id="todos_departamento">Todos Itens</h1>
        </div>

        <!--Search-->
        <div class="row mb-3" >
            <form [formGroup]="formSearch" (ngSubmit)="submit()" class="col-5" role="search" style="width: 250px;">
                <div class="d-flex border rounded">
                    <input class="border-0 m-2 col" formControlName="search" type="search" placeholder="Busca" aria-label="Search">
                    <button class="border-0 col-1 bg-white rounded" type="submit">
                        <span class="material-symbols-outlined">
                            search
                        </span>
                    </button>
                </div>
            </form>
        </div>

        <!--Table-->
        <div class="row itens">
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z3">

                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef class="">
                        <span>Nome</span>
                    </th>
                    <td mat-cell *matCellDef="let element"> {{element.tipo.nome}} </td>
                </ng-container>

                <ng-container matColumnDef="codigoBarra">
                    <th mat-header-cell *matHeaderCellDef> Codigo </th>
                    <td mat-cell *matCellDef="let element">
                    <div class="d-flex align-items-center w-100">
                        {{ element.codigoBarra }}
                        <div class="d-flex ms-auto">
                            <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" >
                                <span class="material-symbols-outlined">
                                    edit
                                </span>
                            </button>
                            <button type="button" class="btn btn-light d-flex justify-content-center align-items-center m-2 p-2" (click)="openDeleteDialog(element)">
                                <span class="material-symbols-outlined">
                                    delete
                                </span>
                            </button>
                        </div>
                    </div>
                    </td>
                </ng-container>
                      
                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </div>
    </div>
</div>
