<div>
    <div>
        <h2>Cadastro de Funcionário</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3 rounded">

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Nome</mat-label>
                <input type="text" formControlName="nome" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline" >
                <mat-label>Acesso</mat-label>
                <mat-select formControlName="role">
                    <mat-option *ngFor="let role of roles" [value]="role">{{role | role}}</mat-option>
                </mat-select>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>CPF</mat-label>
                <input type="text" formControlName="cpf" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Cep</mat-label>
                <input type="text" formControlName="cep" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Telefone</mat-label>
                <input type="text" formControlName="telefone" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input type="text" formControlName="email" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Senha</mat-label>
                <input type="text" formControlName="password" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0 d-flex justify-content-center">
            <button mat-stroked-button type="submit" [disabled]="form.invalid" [ngStyle]="{'height': '50px', 'width': '200px', 'font-size': '1.2em'}">Cadastrar</button>
        </div>
    </form>
</div>
