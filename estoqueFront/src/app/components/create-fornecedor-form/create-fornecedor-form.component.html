<div>
    <div>
        <h2>Cadastro de Fornecedor</h2>
    </div>
    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-3 rounded">

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Nome</mat-label>
                <input type="text" formControlName="nome" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>CNPJ</mat-label>
                <input type="text" formControlName="cnpj" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Cep</mat-label>
                <input type="text" formControlName="cep" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Telefone</mat-label>
                <input type="text" formControlName="telefone" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <mat-form-field appearance="outline">
                <mat-label>Email</mat-label>
                <input type="text" formControlName="email" matInput>
            </mat-form-field>
        </div>

        <div class="row mb-0">
            <button mat-stroked-button mat-dialog-close type="submit" [disabled]="form.invalid" [ngStyle]="{'height': '50px', 'font-size': '1.2em'}">Cadastrar</button>
        </div>
    </form>
</div>
